<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小游戏合集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231B1B1F'/%3E%3Ccircle cx='9.5' cy='12' r='6' fill='%23D81E06'/%3E%3Ccircle cx='16' cy='14' r='5' fill='%230055CC'/%3E%3C/svg%3E">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #F3F4F6;
        color: #1B1B1F;
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 56px 20px 40px;
    }

    main {
        width: 100%;
        max-width: 860px;
    }

    /* ===== 头部 ===== */
    header {
        margin-bottom: 32px;
    }

    h1 {
        font-family: ui-monospace, "Cascadia Mono", "Consolas", "Courier New", monospace;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.2;
    }

    header p {
        margin-top: 12px;
        font-size: 15px;
        color: #5F6470;
        line-height: 1.7;
    }

    /* ===== 游戏菜单 ===== */
    .menu {
        background: #FFFFFF;
        border: 1px solid #E4E5E9;
        border-radius: 14px;
        overflow: hidden;
    }

    .game {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        align-items: center;
        gap: 18px;
        padding: 20px 24px;
        text-decoration: none;
        color: inherit;
        border-bottom: 1px solid #EDEEF1;
        transition: background-color 0.18s ease;
    }

    .game:last-child {
        border-bottom: none;
    }

    .game:hover {
        background: #F7F8FA;
    }

    .game:focus-visible {
        outline: 2px solid #1B1B1F;
        outline-offset: -2px;
    }

    .chip {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.18s ease;
    }

    .game:hover .chip {
        transform: scale(1.06);
    }

    .game .info {
        min-width: 0;
    }

    .game .name {
        display: block;
        font-size: 18px;
        font-weight: 700;
    }

    .game .desc {
        display: block;
        margin-top: 5px;
        font-size: 13.5px;
        color: #5F6470;
        line-height: 1.6;
    }

    .go {
        font-size: 14px;
        font-weight: 600;
        color: #FFFFFF;
        padding: 9px 18px;
        border-radius: 8px;
        white-space: nowrap;
        transition: filter 0.18s ease;
    }

    .game:hover .go {
        filter: brightness(0.92);
    }

    /* 各卡片主题色 */
    .game.farm .chip      { background: rgba(62, 137, 72, 0.12); color: #3E8948; }
    .game.farm .go        { background: #3E8948; }
    .game.farm .chip svg  { stroke: #3E8948; }

    .game.hamburger .chip { background: rgba(217, 108, 44, 0.12); color: #D96C2C; }
    .game.hamburger .go   { background: #D96C2C; }
    .game.hamburger .chip svg { stroke: #D96C2C; }

    .game.ball .chip      { background: rgba(216, 30, 6, 0.10); color: #D81E06; }
    .game.ball .go        { background: #D81E06; }
    .game.ball .chip svg  { stroke: #D81E06; }

    /* ===== 页脚 ===== */
    footer {
        margin-top: 28px;
        font-size: 12.5px;
        color: #9AA0A6;
        text-align: center;
    }

    /* ===== 移动端 ===== */
    @media (max-width: 680px) {
        body {
            padding: 36px 14px 28px;
        }

        h1 {
            font-size: 30px;
        }

        .game {
            grid-template-columns: 52px 1fr;
            gap: 14px;
            padding: 16px;
        }

        .chip {
            width: 52px;
            height: 52px;
        }

        .go {
            grid-column: 1 / -1;
            text-align: center;
            padding: 11px 18px;
        }
    }
</style>
</head>
<body>
<main>
    <header>
        <h1>我的小游戏合集</h1>
        <p>三个用 HTML、CSS 和 JS 做的小玩具，点开就能玩。</p>
    </header>

    <nav class="menu" aria-label="小游戏列表">
        <a class="game farm" href="farm.html">
            <span class="chip" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21v-7"/>
                    <path d="M12 14c-2.8 0-5-1.4-5-4.5 2.8 0 5 1.4 5 4.5Z" fill="currentColor" stroke="none"/>
                    <path d="M12 14c2.8 0 5-1.4 5-4.5C14.2 9.5 12 10.9 12 14Z" fill="currentColor" stroke="none"/>
                    <path d="M12 21v-4.5"/>
                    <circle cx="12" cy="16.5" r="2.1" fill="#F3F4F6" stroke="none"/>
                </svg>
            </span>
            <span class="info">
                <span class="name">水果果果园</span>
                <span class="desc">文字果园经营小游戏，用 100 元初始资金种水果、慢慢攒家底。</span>
            </span>
            <span class="go">进入果园</span>
        </a>

        <a class="game hamburger" href="hamburger.html">
            <span class="chip" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9.5h16c0-2.6-3.6-4.5-8-4.5S4 6.9 4 9.5Z" fill="currentColor" stroke="none"/>
                    <path d="M4 12.5h16" stroke-width="2"/>
                    <path d="M4 14h16" stroke-width="1.4" stroke-dasharray="1 3" opacity="0.7"/>
                    <rect x="4" y="14.5" width="16" height="4" rx="1.6" fill="#C9812F" stroke="none"/>
                    <path d="M6 19.8h12c0 1-1 1.8-2 1.8H8c-1 0-2-.8-2-1.8Z" fill="#E8A95B" stroke="none"/>
                </svg>
            </span>
            <span class="info">
                <span class="name">汉堡小摊模拟器</span>
                <span class="desc">文字汉堡摊经营游戏，带 3500 元启动资金，从第一单汉堡做起。</span>
            </span>
            <span class="go">进入小摊</span>
        </a>

        <a class="game ball" href="double-color-ball.html">
            <span class="chip" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9.5" cy="12.5" r="6" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="14.5" r="4.8" fill="#0055CC" stroke="none"/>
                    <circle cx="7.6" cy="10.6" r="1.5" fill="#FFFFFF" opacity="0.75"/>
                    <circle cx="14.6" cy="12.8" r="1.1" fill="#FFFFFF" opacity="0.75"/>
                </svg>
            </span>
            <span class="info">
                <span class="name">双色球多注投注小游戏</span>
                <span class="desc">红蓝双色球多注投注模拟，机选一注试试今天的手气。</span>
            </span>
            <span class="go">开始投注</span>
        </a>
    </nav>

    <footer>本页与三个小游戏都是静态文件，托管在 GitHub Pages。</footer>
</main>
</body>
</html>
